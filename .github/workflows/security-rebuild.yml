name: Weekly Security Rebuild

# Gated security rebuild (COSY-926).
#
# Most CVEs reported against this image come from the Go toolchain baked into
# the `service` binary, not from anything in a manifest: of the 9 findings on
# 2026.7.2, 7 were Go stdlib. Those are fixed by rebuilding on the floating
# `golang:1.25-alpine` tag, which no dependency bot can propose. So once a week
# we rebuild and republish — but ONLY if the rebuild actually clears a CVE, so
# users don't get an update badge in Docker Desktop for a no-op release.
#
# Modelled on the `security-rebuild` job in localstack-pro's aws_flink.yml.

on:
  schedule:
    # Tuesdays 08:00 UTC — ~22h ahead of the secops Wednesday 06:00 UTC CVE
    # scan, so anything cleared here never gets filed as a finding.
    - cron: "0 8 * * TUE"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scan and rebuild, but never publish"
        type: boolean
        default: false

concurrency:
  group: security-rebuild
  cancel-in-progress: false

jobs:
  security-rebuild:
    name: Rebuild and republish if CVEs clear
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      IMAGE: localstack/localstack-docker-desktop
      PLATFORMS: linux/amd64,linux/arm64
      # Mirror the Trivy vuln DBs to dodge GHCR rate limits — same workaround
      # the secops weekly scan and aws_flink.yml use (trivy-action issue #389).
      TRIVY_DB_REPOSITORY: "ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db"
      TRIVY_JAVA_DB_REPOSITORY: "ghcr.io/aquasecurity/trivy-java-db,public.ecr.aws/aquasecurity/trivy-java-db"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read published version
        id: version
        run: |
          TAG=$(sed -n 's/^TAG?=\(.*\)$/\1/p' Makefile)
          echo "Currently published: ${IMAGE}:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Scan published image (before)
        # exit-code is left unset: findings are the signal to rebuild, not a
        # failure. --ignore-unfixed matches what the secops pipeline files, so
        # an unfixable advisory (e.g. GO-2026-5932) can't loop here forever.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: before.json

      - name: Determine fixable CVEs (before)
        id: before
        run: |
          jq -r '[.Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique | .[]' before.json | sort -u > before_cves.txt
          echo "Fixable HIGH/CRITICAL CVEs on the published image:"; cat before_cves.txt || true
          if [ -s before_cves.txt ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Published image is clean — nothing to rebuild."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.before.outputs.proceed == 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        if: steps.before.outputs.proceed == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Download CLI binaries
        if: steps.before.outputs.proceed == 'true'
        run: bash downloadBinaries.sh

      - name: Build candidate (amd64, for scanning)
        if: steps.before.outputs.proceed == 'true'
        # --pull --no-cache is the whole point of the job: a cached base layer
        # would reproduce the same image and clear nothing. Correctness over
        # the few minutes a warm cache would save on a weekly run.
        run: |
          docker buildx build --load --pull --no-cache \
            --platform linux/amd64 \
            --tag dde-candidate:scan .

      - name: Smoke-test candidate
        if: steps.before.outputs.proceed == 'true'
        run: ./scripts/smoke-test.sh dde-candidate:scan

      - name: Scan candidate (after)
        if: steps.before.outputs.proceed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dde-candidate:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: after.json

      - name: Compute cleared CVEs (before - after)
        id: delta
        if: steps.before.outputs.proceed == 'true'
        run: |
          jq -r '[.Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique | .[]' after.json | sort -u > after_cves.txt
          comm -23 before_cves.txt after_cves.txt > cleared.txt
          comm -13 before_cves.txt after_cves.txt > introduced.txt

          echo "Cleared by the rebuild:"; cat cleared.txt || true
          # Refreshing to newer upstream rarely adds CVEs, and when it does we'd
          # still rather ship the net improvement — so this is reported, not gated.
          if [ -s introduced.txt ]; then
            echo "::warning::Rebuild introduced new CVEs: $(paste -sd', ' introduced.txt)"
          fi

          if [ -s cleared.txt ]; then
            echo "cleared=true" >> "$GITHUB_OUTPUT"
          else
            echo "cleared=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report CVEs a rebuild cannot fix
        # A rebuild only moves the base image and the Go toolchain. Anything
        # left needs a dependency bump, which is Dependabot's half of COSY-926
        # — surface it instead of silently no-op'ing every week until the SLA
        # on the secops ticket burns.
        if: steps.before.outputs.proceed == 'true' && steps.delta.outputs.cleared == 'false'
        run: |
          echo "::warning::Rebuild cleared nothing; these need a dependency bump: $(paste -sd', ' before_cves.txt)"
          {
            echo "### Rebuild cleared no CVEs"
            echo
            echo "Still present after a clean rebuild — these need a \`vm/go.mod\` bump, not a rebuild:"
            echo
            sed 's/^/- /' before_cves.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bump version
        id: bump
        if: steps.delta.outputs.cleared == 'true' && !inputs.dry_run
        run: |
          NEW=$(./scripts/bump-version.sh cleared.txt)
          echo "Releasing ${NEW}"
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        if: steps.delta.outputs.cleared == 'true' && !inputs.dry_run
        env:
          NEW: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile Dockerfile CHANGELOG.md
          git commit -m "Security rebuild ${NEW}"
          git tag "v${NEW}"
          git push origin HEAD:main "v${NEW}"

      - name: Login to Docker Hub
        if: steps.delta.outputs.cleared == 'true' && !inputs.dry_run
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish (multi-arch)
        # Published from here rather than by letting build-push-docker.yml pick
        # up the tag: pushes made with GITHUB_TOKEN don't trigger workflows.
        if: steps.delta.outputs.cleared == 'true' && !inputs.dry_run
        env:
          NEW: ${{ steps.bump.outputs.version }}
        run: |
          echo "Publishing ${IMAGE}:${NEW}, clearing:"; cat cleared.txt
          docker buildx build --push --pull --no-cache \
            --platform "${PLATFORMS}" \
            --tag "${IMAGE}:${NEW}" .

      - name: Summary
        if: always()
        run: |
          {
            echo "### Weekly security rebuild"
            echo
            echo "- Published image: \`${IMAGE}:${{ steps.version.outputs.tag }}\`"
            echo "- Fixable HIGH/CRITICAL before: $(wc -l < before_cves.txt 2>/dev/null || echo 0)"
            echo "- Cleared by rebuild: $(wc -l < cleared.txt 2>/dev/null || echo 0)"
            echo "- Released: ${{ steps.bump.outputs.version || 'no (nothing cleared)' }}"
          } >> "$GITHUB_STEP_SUMMARY"
